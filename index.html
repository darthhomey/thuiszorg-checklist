<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thuiszorg Checklist</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial; max-width: 900px; margin: 20px auto; background:#f9f9f9; }
.hidden { display:none; }
#login-screen { max-width:400px; margin:100px auto; padding:30px; background:white; border-radius:10px; }
.task { margin:10px 0; }
button { padding:10px; margin-top:10px; }
.tabs { display:flex; gap:10px; }
.tab { padding:10px; background:#ddd; cursor:pointer; }
.tab.active { background:#4CAF50; color:white; }
.checklist { display:none; }
.checklist.active { display:block; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Wachtwoord"><br>
<button onclick="login()">Login</button>
<button onclick="signup()">Account maken</button>
<p id="error" style="color:red;"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">
<button onclick="logout()">Logout</button>
<h1>Checklist</h1>
<p id="logged-in-as"></p>

<!-- MEDEWERKER -->
<div id="employee-view">
<div class="tabs">
<div class="tab active" onclick="openTab('ochtend')">Ochtend</div>
<div class="tab" onclick="openTab('middag')">Middag</div>
</div>

<div id="ochtend" class="checklist active">
<div class="task"><input type="checkbox"> Ontbijt</div>
<div class="task"><input type="checkbox"> Medicatie</div>
<button onclick="completeChecklist('ochtend')">Opslaan</button>
</div>

<div id="middag" class="checklist">
<div class="task"><input type="checkbox"> Avondeten</div>
<div class="task"><input type="checkbox"> Wandeling</div>
<button onclick="completeChecklist('middag')">Opslaan</button>
</div>

<div id="result"></div>
</div>

<!-- COORDINATOR -->
<div id="coordinator-view" class="hidden">
<h2>Overzicht</h2>
<ul id="overview"></ul>
<div id="detail"></div>
</div>

</div>

<script>
const SUPABASE_URL = "https://rdytzmzadcmvtougqlcp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkeXR6bXphZGNtdnRvdWdxbGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzkyOTUsImV4cCI6MjA4NTM1NTI5NX0.V7smr9bVPAhxVFROnG59dE0QFj4XKi5EGoPggY2BhmU";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let userRole = "employee";

// signup
async function signup() {
    const { error } = await supabase.auth.signUp({
        email: emailEl().value,
        password: passEl().value
    });

    if (error) showError(error.message);
    else alert("Account aangemaakt!");
}

// login
async function login() {
    const { data, error } = await supabase.auth.signInWithPassword({
        email: emailEl().value,
        password: passEl().value
    });

    if (error) return showError(error.message);

    await loadUserProfile(data.user);
}

// profiel laden
async function loadUserProfile(user) {
    currentUser = user;

    const { data } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    userRole = data.role;

    startApp();
}

// app starten
function startApp() {
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("logged-in-as").innerText =
        currentUser.email + " (" + userRole + ")";

    if (userRole === "coordinator") {
        document.getElementById("employee-view").classList.add("hidden");
        document.getElementById("coordinator-view").classList.remove("hidden");
        loadOverview();
        subscribeRealtime();
    }
}

// logout
async function logout() {
    await supabase.auth.signOut();
    location.reload();
}

// checklist opslaan
async function completeChecklist(type) {
    const div = document.getElementById(type);
    const tasks = div.querySelectorAll(".task");

    let summary = `${type} - ${currentUser.email}\n`;

    tasks.forEach(t => {
        const checked = t.querySelector("input").checked;
        summary += (checked ? "✓ " : "✗ ") + t.innerText + "\n";
    });

    await supabase.from("checklists").insert([{
        user_id: currentUser.id,
        user_name: currentUser.email,
        dienst: type,
        summary: summary
    }]);

    document.getElementById("result").innerText = "Opgeslagen!";
}

// overzicht
async function loadOverview() {
    const { data } = await supabase
        .from("checklists")
        .select("*")
        .order("created_at", { ascending: false });

    const list = document.getElementById("overview");
    list.innerHTML = "";

    data.forEach(item => {
        const li = document.createElement("li");
        li.innerText = item.user_name + " - " + item.dienst;

        li.onclick = () => {
            document.getElementById("detail").innerText = item.summary;
        };

        list.appendChild(li);
    });
}

// realtime
function subscribeRealtime() {
    supabase.channel("checklists")
        .on("postgres_changes", {
            event: "INSERT",
            schema: "public",
            table: "checklists"
        }, loadOverview)
        .subscribe();
}

// tabs
function openTab(name) {
    document.querySelectorAll(".checklist").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));

    document.getElementById(name).classList.add("active");
    event.target.classList.add("active");
}

// helpers
function emailEl(){ return document.getElementById("email"); }
function passEl(){ return document.getElementById("password"); }
function showError(msg){ document.getElementById("error").innerText = msg; }

// session check
(async () => {
    const { data } = await supabase.auth.getSession();
    if (data.session) {
        await loadUserProfile(data.session.user);
    }
})();
</script>

</body>
</html>
